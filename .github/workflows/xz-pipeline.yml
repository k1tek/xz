name: XZ Processor Pipeline

on:
  push:
    branches:
      - ino_dev

env:
  IMAGE_NAME: "xz-processor-app"

jobs:
  build-deploy-test:
    name: Build & Test XZ
    runs-on: ubuntu-latest 

    steps:
      - name: 1. Clean & Checkout
        uses: actions/checkout@v4

      - name: 2. Prepare Input (xz)
        run: |
          echo "Tworzenie pliku my_input i kompresja xz..."
          echo "To jest testowy tekst, ktory Jenkins skompresuje, a Docker zdekompresuje." > my_input.txt
          
          docker run --rm -v ${{ github.workspace }}:/app -w /app alpine:3.19 sh -c "apk add --no-cache xz > /dev/null && xz -c my_input.txt > input.xz"

      - name: 3. Build (XZ Image)
        run: |
          echo "Budowanie obrazu Dockera (Ubuntu) z narzędziem xz..."
          docker build --no-cache -t ${{ env.IMAGE_NAME }}:latest .

      - name: 4. Deploy & Test (out ok?)
        run: |
          echo "Uruchamianie kontenera docelowego, przetwarzanie input.xz i walidacja..."
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.IMAGE_NAME }}:latest sh -c "cat input.xz | xz -d > out.txt"

          echo "Walidacja: 'out ok?'"
          if cmp -s my_input.txt out.txt; then
            echo "[SUKCES] Plik out.txt jest identyczny z my_input.txt. Dekompresja w kontenerze przebiegła pomyślnie."
          else
            echo "[BŁĄD] Pliki się różnią!"
            exit 1
          fi

      - name: 5. Publish & Archive
        uses: actions/upload-artifact@v4
        with:
          name: xz-artifacts
          path: |
            my_input.txt
            input.xz
            out.txt
          retention-days: 7
